<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Vault — Pencuri Brankas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-left">
      <span id="level-name">Level 1 · Lobi Bank Merdeka</span>
      <span id="timer-text" class="pill">2:30</span>
    </div>
    <div class="hud-mid">
      <span id="alarm-wrap"><span id="alarm-text">ALARM 0%</span>
        <span id="alarm-bar"><span id="alarm-fill"></span></span>
      </span>
      <span id="message-text"></span>
    </div>
    <div class="hud-right">
      <span id="loot-text" class="pill">0/3 💰</span>
      <span id="score-text" class="pill">0</span>
      <span id="smoke-text" class="pill">💨×2</span>
      <span id="emp-text" class="pill">⚡×2</span>
    </div>
  </header>
  <div id="stage">
    <canvas id="game-canvas" width="1280" height="656"></canvas>
    <div id="overlay" class="hidden">
      <div id="overlay-panel">
        <h1 id="overlay-title"></h1>
        <div id="overlay-body"></div>
        <div id="overlay-buttons"></div>
      </div>
    </div>
  </div>
  <footer id="help">
    WASD / panah bergerak · klik jalan ke titik · Q bom asap · E EMP kamera · M suara · Esc jeda
  </footer>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
